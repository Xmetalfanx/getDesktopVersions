# F38 https://packages.fedoraproject.org/search?query=firefox&releases=Fedora+38
# F37 https://packages.fedoraproject.org/search?query=firefox&releases=Fedora+37


function get_fedora_info() {
    case $1 in
        budgie) local desktop="budgie-desktop" ;;
        gnome-desktop) local desktop="gnome-shell" ;;
        lxde) local desktop="lxde-common" ;;
        lxqt) local desktop="liblxqt" ;;
        mate) local desktop="mate-desktop" ;;
        xfce) local desktop="xfwm4" ;;
        *) local desktop=$1 ;;
    esac

    local fedora_url="https://packages.fedoraproject.org/pkgs/$desktop/$desktop/"

    local fedora42Version=$(curl -sL $fedora_url | awk -F ">" '/fc42/ && !/testing/ {print $2}' | sed 's/<\/a//' )

    local fedora43Version=$(curl -sL $fedora_url | awk -F ">" '/fc43/ && !/testing/{print $2}' | sed 's/<\/a//' )

}

function display_fedora_info() {
    local current_output_file="fedora_versions.txt"
    display_date
    echo -e "\nDesktop:\t${desktop}" | output_to_file
    echo -e "Fedora 42 Version: $fedora42Version" | output_to_file
    echo -e "Fedora 43 Version: $fedora43Version" | output_to_file
}
