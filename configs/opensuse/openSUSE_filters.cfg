# Start of Filters

function leap_filter1() {
   # original
   curl -s "${leap_url}" | grep ">$desktop-[0-9]" | sed 's/\.x86.*$//;s///'
}

function leap_filter2() {

    local package_name="$1"
    local leap_url="$2"

    # echo -e "\npackage_name:\t$package_name\nleap_url:\t$leap_url\n" >&2
    #userPrompt

    curl -s "$leap_url" \
      | awk -F '\./' -v package="$package_name" '$2 ~ ("^" package "-[0-9]" ) { print $2; exit }' \
      | sed "s/^.*$package_name-//;s/.x86.*$//"
}


# from openAi/openchatgpt
function leap_filter3() {

    curl -s "${leap_url}" | awk -v desktop="$desktop" '
      # build a regex like desktop-([0-9.]+)
      {
        regex = desktop "-([0-9.]+)"
        if (match($0, regex, m)) {
          print m[1]
        }
      }
    ' \
  | head -1
}

# End of filters
