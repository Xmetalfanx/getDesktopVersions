
function get_opensuse_tumbleweed_version() {

    local tw_package_version=$(curl -s "${tumbleweed_url}" | awk -v package_name="$package_name" '$0 ~ package_name "-[0-9]" { print; exit }' | sed "s/^.*$package_name-//;s/.x86.*$//" )

    display_opensuse_info "tumbleweed" "$desktop" "$package_name" "$tw_package_version"
}
