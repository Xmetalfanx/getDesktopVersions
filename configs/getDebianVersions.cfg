# Future Idea: make this a universal function
# pass the desktop (instead of having it a var IN the function), as a variable
function get_debian_info() {

    case $1 in
        budgie) local desktop="budgie-desktop" ;;
        gnome-desktop) local desktop="gnome" ;;
        mate) local desktop="mate-desktop-environment" ;;
        xfce) local desktop="xfce4" ;;
        *) local desktop=$1 ;;
    esac

    # note to self: do not put sid here
    # change info here after "in", down the line for updating
        # Forky - Current "Testing" codename
        # Trixie - Current "stable" release
        # Bookworm - Current "oldstable" release
    for rel in bookworm trixie forky; do
        local version=$(fetch_debian_version "$rel" "$desktop")
        case $rel in
            bookworm) local bookworm_version=$version ;;
            trixie) local trixie_version=$version ;;
            forky) local forky_version=$version ;;
        esac
    done

    local sid_version=$(curl -s $sidURL/$desktop | grep "Package: $desktop" | filter_debian "$desktop" )

    # debug_display_versions $bookworm_version $trixie_version $forky_version $sid_version

    # test moving call here
    display_debian_info $bookworm_version $trixie_version $forky_version $sid_version

    #unset_debian_variables
}


function display_debian_info() {
    local current_output_file="debian_versions.txt"

    display_date

    echo -e "\nDesktop: ${desktop}" | output_to_file

    echo -e "bookworm (Old Stable) version: ${bookworm_version}" | output_to_file
    echo -e "trixie (Stable) version: ${trixie_version}" | output_to_file
    echo -e "forky (Testing) version: ${forky_version}" | output_to_file
    echo -e "sid (Unstable) version: ${sid_version}" | output_to_file
}
