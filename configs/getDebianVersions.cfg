# https://packages.debian.org/buster/cinnamon

# function that filters out extra parts of the output
function filter_debian() {

    case $desktop in
        gnome)
            grep "Package: $desktop" | sed "s/^.*(1://g;s/).*$//g"
            ;;

        plasma-desktop)
            grep "Package: $desktop" | sed "s/^.*(4://g;s/).*$//g"
            ;;

        *)

            # first sed
                # i think ...
                # - removes start of line to (
            # second sed
                # - remove ) to the end of the line
            grep "Package: $desktop" | sed "s/^.*(//g;s/).*$//g"

        ;;

    esac
}


function fetch_debian_version_debugging() {
    printf "%s \nDEBUG:release:$release\n"
    printf "%s DEBUG pkg: $pkg\n\n"
    userPrompt
}

# Fetches the Debian version info
function fetch_debian_version() {
    local release=$1
    local pkg=$2

    local current_package_link="${debian_packages_url}/${release}/${pkg}"

    curl -s "${current_package_link}" 2>/dev/null | filter_debian "$pkg"
}

function unset_debian_variables() {
    # calling this here causes issues ftr
    # unset_variables

    printf "%s\nUnsetting Debian Variables\n"
    unset debian_packages_url sidURL

    userPrompt
}

# Sets up/loads the variables
function load_debian_vars() {

    echo -e "Loading Debian Variables"
    debian_packages_url="https://packages.debian.org"

    # Sid/unstable
    sidURL="${debian_packages_url}/sid/"

    # echo statement for testing
    echo -e "Debian Variables loaded"
}

load_debian_vars


